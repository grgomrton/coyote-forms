name: CI

on:
  push:
    tags:
      - 'create-release-*'

jobs:
  create_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create release commit and increment minor version
        run: mvn --batch-mode release:prepare -f pom.xml